services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autohub
      POSTGRES_USER: autohub
      POSTGRES_PASSWORD: autohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohub -d autohub"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./autohub_bd
    environment:
      DATABASE_URL: postgres://autohub:autohub@db:5432/autohub
      SECRET_KEY: ${SECRET_KEY:-dev-only-do-not-use-in-prod}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./autohub_bd:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backend_media:
